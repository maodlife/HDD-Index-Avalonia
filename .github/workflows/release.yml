name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOLUTION_PATH: HDD-Index/HDD-Index.sln
      PROJECT_PATH: HDD-Index/HDD-Index.csproj
      RUNTIME_IDENTIFIER: win-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release source
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/master."
          }

          $tagCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to resolve the tag commit."
          }

          $masterCommit = git rev-parse refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to resolve origin/master."
          }

          if ($tagCommit.Trim() -ne $masterCommit.Trim()) {
            throw "Release tags must point to the latest origin/master commit."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $versionMatch = [regex]::Match(
            $tag,
            '^v(?<major>\d+)\.(?<minor>\d+)(?:\.(?<patch>\d+))?$')
          if (-not $versionMatch.Success) {
            throw "Release tags must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH."
          }

          $patch = $versionMatch.Groups["patch"].Value
          if ([string]::IsNullOrEmpty($patch)) {
            $patch = "0"
          }

          $releaseVersion = "$($versionMatch.Groups["major"].Value).$($versionMatch.Groups["minor"].Value).$patch"
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "ARCHIVE_NAME=HDD-Index-$tag-win-x64" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --no-restore --verbosity normal

      - name: Restore Windows publish dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} --runtime ${{ env.RUNTIME_IDENTIFIER }}

      - name: Publish and package
        id: package
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -PackageLabel $env:GITHUB_REF_NAME `
            -RuntimeIdentifier $env:RUNTIME_IDENTIFIER `
            -OutputDirectory $env:RUNNER_TEMP

          $archivePath = Join-Path $env:RUNNER_TEMP "$($env:ARCHIVE_NAME).zip"
          $checksumPath = "$archivePath.sha256"
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            $env:ARCHIVE_PATH `
            $env:CHECKSUM_PATH `
            --verify-tag `
            --title "HDD Index $env:GITHUB_REF_NAME" `
            --generate-notes
