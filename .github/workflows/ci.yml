name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HDD-Index/HDD-Index.sln

      - name: Verify app and test formatting
        run: dotnet format HDD-Index/HDD-Index.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build HDD-Index/HDD-Index.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test HDD-Index/HDD-Index.sln --configuration Release --no-build --no-restore --verbosity normal

      - name: Restore Windows publish dependencies
        run: dotnet restore HDD-Index/HDD-Index.csproj --runtime win-x64

      - name: Validate Windows release package
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version 0.0.0 `
            -PackageLabel ci `
            -RuntimeIdentifier win-x64 `
            -OutputDirectory $env:RUNNER_TEMP
